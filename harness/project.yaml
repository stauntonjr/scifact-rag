{
  "schema_version": "1.0",
  "harness_version": "0.5.0",
  "template_mode": false,
  "project": {
    "name": "SciFact RAG",
    "summary": "A CLI-first grounded retrieval-augmented generation prototype over the public SciFact corpus using PostgreSQL with pgvector and VectorChord-BM25, MiniLM embeddings, and a DGX-hosted NVFP4 generator.",
    "lifecycle": "new",
    "profile": "python-data",
    "status": "active",
    "repository": "stauntonjr/scifact-rag"
  },
  "intent": {
    "users": [
      "Developer or researcher evaluating a small inspectable RAG system"
    ],
    "outcomes": [
      "Ingest the SciFact corpus, retrieve relevant evidence, and generate an answer with document citations or an explicit insufficient-evidence result",
      "Measure retrieval against the public BEIR SciFact qrels using standard metrics"
    ],
    "success_metrics": [
      "All 5,183 SciFact corpus documents can be ingested reproducibly",
      "The CLI reports nDCG, MAP, recall, precision, and MRR from public qrels",
      "Retrieval exceeds the original nDCG@10 baseline of 0.526066 without reducing recall@10 below 0.661722",
      "An end-to-end ask command returns a grounded cited answer or insufficient evidence"
    ],
    "in_scope": [
      "Typer CLI commands for ingest, search, ask, and retrieval evaluation",
      "Python dataclass domain and application contracts",
      "One explicit composition root with PostgreSQL/pgvector/VectorChord-BM25, MiniLM, SciFact, and OpenAI-compatible generation adapters",
      "Docker Compose operation on one DGX Spark"
    ],
    "out_of_scope": [
      "HTTP API, MCP adapter, or web UI",
      "Pi or weaker-model effectiveness comparisons",
      "A bespoke adoption-effectiveness evaluation framework",
      "Tool-calling by the generation model",
      "Production deployment or multi-node operation"
    ]
  },
  "constraints": {
    "security": [
      "No secrets in the repository"
    ],
    "data_classification": "public benchmark data and locally generated evaluation artifacts",
    "deployment": "Docker Compose on one NVIDIA DGX Spark; generator reached through a published OpenAI-compatible host endpoint",
    "budget": "One DGX Spark and locally hosted open components; no paid service is required for the prototype",
    "licenses": [
      "Application code: MIT",
      "SciFact claims and evidence annotations: CC BY 4.0",
      "SciFact abstracts from S2ORC: ODC-By 1.0",
      "MiniLM and Qwen NVFP4 model checkpoints: Apache-2.0",
      "MS MARCO MiniLM L6 cross-encoder checkpoint: Apache-2.0",
      "AnswerAI ColBERT small checkpoint: Apache-2.0",
      "DeBERTa v3 large NLI checkpoint: Apache-2.0; published training sources are SNLI and MultiNLI",
      "RankLLM at pinned source revision: Apache-2.0",
      "RankZephyr 7B V1 Full checkpoint: MIT",
      "Hugging Face Text Embeddings Inference: Apache-2.0",
      "vLLM: Apache-2.0; pinned NVIDIA vLLM container retains separate NVIDIA AI Product terms",
      "FastCoref code and FCoref checkpoint: MIT",
      "pgvector: PostgreSQL license",
      "pg_tokenizer: Apache-2.0",
      "VectorChord-BM25: AGPLv3 or Elastic License v2, separate from the MIT application"
    ]
  },
  "engineering": {
    "languages": [
      "Python"
    ],
    "build_commands": [
      "uv build"
    ],
    "test_commands": [
      "uv run pytest"
    ],
    "command_contract": {
      "primary_check": "make smoke",
      "bootstrap": "uv sync --locked",
      "format_check": "uv run ruff format --check src tests",
      "lint": "uv run ruff check src tests",
      "typecheck": "uv run pyright",
      "unit": "uv run pytest --cov=scifact_rag --cov-branch --cov-report=term-missing -m 'not integration'",
      "integration": "uv run pytest -m integration",
      "package_smoke": "python3 tools/python_package_smoke.py"
    },
    "quality": {
      "dependency_lock": "uv.lock",
      "coverage_policy": "branch-coverage-baseline-required-before-release",
      "required_checks": [
        "format_check",
        "lint",
        "typecheck",
        "unit"
      ],
      "property_testing": "hypothesis"
    },
    "versioning": {
      "strategy": "semver",
      "current": "0.1.0",
      "public_contract": [
        "CLI commands and JSON result schemas",
        "Docker Compose environment-variable contract"
      ],
      "source": "harness/project.yaml:engineering.versioning.current",
      "tag_prefix": "v",
      "pre_1_0_policy": "breaking-changes-bump-minor",
      "release_notes": "CHANGELOG.md"
    },
    "architecture_changes_require_adr": true,
    "public_interface_acceptance_required": true
  },
  "autonomy": {
    "level": "supervised",
    "network_writes": "explicit-human-approval",
