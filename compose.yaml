services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: scifact-rag-postgres:pg17-pgvector0.8.6-vchord-bm250.3.0
    environment:
      POSTGRES_DB: scifact
      POSTGRES_USER: scifact
      POSTGRES_PASSWORD: scifact-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scifact -d scifact"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:121-sha-fc071b1@sha256:c42fb67547f6100002a0ea60e33d2ebbbcddce669314d4459f326f402bc2e84c
    command:
      - --model-id
      - cross-encoder/ms-marco-MiniLM-L6-v2
      - --revision
      - 233902d25c440f23af6f7d6e94d2946bac0bee0a
      - --auto-truncate
      - --max-client-batch-size
      - "256"
      - --max-batch-tokens
      - "65536"
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - huggingface-cache:/data

  late-interaction:
    image: nvcr.io/nvidia/vllm:26.06-py3@sha256:bebcf9576b1720214319ee5c7ee4f7661954cbbf59ed3fcd188cd79a67f1967e
    entrypoint: ["vllm", "serve"]
    command:
      - answerdotai/answerai-colbert-small-v1
      - --revision
      - c72aa89bc61afdd85373643f3a1a75b2aad6e0fe
      - --served-model-name
      - answerdotai/answerai-colbert-small-v1
      - --host
      - 0.0.0.0
      - --port
      - "80"
      - --dtype
      - float16
      - --gpu-memory-utilization
      - "0.05"
    environment:
      HF_HOME: /data
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 2s
      timeout: 3s
      retries: 60
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - huggingface-cache:/data

  rankzephyr-model:
    image: nvcr.io/nvidia/vllm:26.06-py3@sha256:bebcf9576b1720214319ee5c7ee4f7661954cbbf59ed3fcd188cd79a67f1967e
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        snapshot_path="$$(python3 -c 'from huggingface_hub import snapshot_download; print(snapshot_download("castorini/rank_zephyr_7b_v1_full", revision="aa11d9da444ec3490827656c3b961d5c5f3af0eb", cache_dir="/data/rankzephyr-cache"))')"
        ln -sfn "$$snapshot_path" /data/rankzephyr
        exec vllm serve /data/rankzephyr \
          --served-model-name /data/rankzephyr \
          --host 0.0.0.0 \
          --port 80 \
          --dtype bfloat16 \
          --max-model-len 8192 \
          --max-num-seqs 1 \
          --gpu-memory-utilization 0.20
    environment:
      HF_HOME: /data
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 2s
      timeout: 3s
      retries: 300
    ports:
      - "127.0.0.1:8084:80"
    volumes:
      - huggingface-cache:/data

  rankllm:
    build:
      context: .
      dockerfile: Dockerfile.rankllm
    image: scifact-rag-rankllm:8ad18be
    entrypoint: ["python3", "-c"]
    command:
      - |
        import uvicorn
        from rank_llm.api.app import create_app
        from rank_llm.api.runtime import ServerConfig
        config = ServerConfig(
            model_path="/data/rankzephyr",
            base_url="http://rankzephyr-model:80/v1",
            listwise_vllm_with_openai_sdk=True,
            context_size=4096,
            variable_passages=True,
            window_size=20,
            stride=10,
            max_passage_words=300,
        )
        uvicorn.run(create_app(config), host="0.0.0.0", port=80)
    depends_on:
      rankzephyr-model:
        condition: service_healthy
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - huggingface-cache:/data

  scientific-inference:
    profiles: ["scientific-inference"]
    build:
      context: .
      dockerfile: Dockerfile.scientific-inference
    image: scifact-rag-scientific-inference:deberta-v3-large
    environment:
      SCIENTIFIC_INFERENCE_MODEL: cross-encoder/nli-deberta-v3-large
      SCIENTIFIC_INFERENCE_REVISION: bab4bc7178836f731dcfd18c06ca9def0a137712
      SCIENTIFIC_INFERENCE_MAX_TOKENS: "512"
      HF_HOME: /data
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 2s
      timeout: 3s
      retries: 300
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - huggingface-cache:/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://scifact:scifact-local@postgres:5432/scifact
      EMBEDDING_MODEL: sentence-transformers/paraphrase-MiniLM-L6-v2
      GENERATOR_BASE_URL: ${GENERATOR_BASE_URL:-http://host.docker.internal:8000/v1}
      GENERATOR_MODEL: ${GENERATOR_MODEL:-nvidia/Qwen3.6-35B-A3B-NVFP4}
      RERANKER_BASE_URL: http://reranker:80
      LATE_INTERACTION_BASE_URL: http://late-interaction:80
      LATE_INTERACTION_MODEL: answerdotai/answerai-colbert-small-v1
      RANK_LLM_BASE_URL: http://rankllm:80
      SCIENTIFIC_INFERENCE_BASE_URL: http://scientific-inference:80
      HF_HOME: /models/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - huggingface-cache:/models/huggingface

  api:
    build: .
    entrypoint: ["uv", "run", "--no-dev", "uvicorn"]
    command:
      - scifact_rag.http_api:build_http_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "80"
      - --workers
      - "1"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://scifact:scifact-local@postgres:5432/scifact
      EMBEDDING_MODEL: sentence-transformers/paraphrase-MiniLM-L6-v2
      GENERATOR_BASE_URL: ${GENERATOR_BASE_URL:-http://host.docker.internal:8000/v1}
      GENERATOR_MODEL: ${GENERATOR_MODEL:-nvidia/Qwen3.6-35B-A3B-NVFP4}
      RERANKER_BASE_URL: http://reranker:80
      LATE_INTERACTION_BASE_URL: http://late-interaction:80
      LATE_INTERACTION_MODEL: answerdotai/answerai-colbert-small-v1
      RANK_LLM_BASE_URL: http://rankllm:80
      SCIENTIFIC_INFERENCE_BASE_URL: http://scientific-inference:80
      HF_HOME: /models/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - huggingface-cache:/models/huggingface

  mcp:
    build: .
    entrypoint: ["uv", "run", "--no-dev", "python"]
    command:
      - -m
      - scifact_rag.mcp_server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://scifact:scifact-local@postgres:5432/scifact
      EMBEDDING_MODEL: sentence-transformers/paraphrase-MiniLM-L6-v2
      GENERATOR_BASE_URL: ${GENERATOR_BASE_URL:-http://host.docker.internal:8000/v1}
      GENERATOR_MODEL: ${GENERATOR_MODEL:-nvidia/Qwen3.6-35B-A3B-NVFP4}
      RERANKER_BASE_URL: http://reranker:80
      LATE_INTERACTION_BASE_URL: http://late-interaction:80
      LATE_INTERACTION_MODEL: answerdotai/answerai-colbert-small-v1
      RANK_LLM_BASE_URL: http://rankllm:80
      SCIENTIFIC_INFERENCE_BASE_URL: http://scientific-inference:80
      HF_HOME: /models/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - huggingface-cache:/models/huggingface

volumes:
  postgres-data:
  huggingface-cache:
