[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scifact-rag"
version = "0.1.0"
description = "CLI-first grounded RAG prototype over the SciFact corpus"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "fastapi>=0.116,<1",
  "fastcoref @ https://github.com/shon-otmazgin/fastcoref/archive/ae224139196d122b225af5a7e73b5fc0b6e1076d.tar.gz",
  "httpx>=0.28,<1",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "sentence-transformers>=5.1,<6",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
scifact-rag = "scifact_rag.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.403",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scifact_rag"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the Compose PostgreSQL service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
branch = true
relative_files = true
source = ["scifact_rag"]
