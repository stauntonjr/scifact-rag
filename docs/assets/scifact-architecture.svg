<text x="40" y="84" font-size="32" font-weight="700" fill="#0f172a">From scientific abstracts to inspectable, cited answers</text>
<text x="40" y="115" class="body">One DGX-local application. Separate evidence retrieval and scientific-fidelity evaluation.</text>

