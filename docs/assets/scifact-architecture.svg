<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">SciFact-RAG: inspectable scientific evidence retrieval and answering</title>
<desc id="desc">Public SciFact abstracts retain titles and parent-document IDs. MiniLM embeddings and source-preserving title, token-window, and coreference representations are stored in PostgreSQL with pgvector and VectorChord-BM25. A question enters the shared RagApplication through CLI, HTTP, MCP, or browser. Six channels generate a deduplicated parent-document candidate pool. The selected default reranks every candidate by its best ColBERT MaxSim score over bounded dynamic-programming content views. Search returns ranked evidence with matching passages. Answering assembles whole-document context by default, with adaptive context opt-in, calls local Qwen, and checks citations against retrieved parent IDs. It returns a cited answer or explicit insufficient evidence; service failures remain errors. Citation identity does not prove scientific support. Retrieval and generation evaluation are separate, with retained manifests, revisions, digests, and inspected-data limits. Experimental NLI scoring and stopped proposition or graph work remain outside the default request path.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 8 5 L 0 9 Z" fill="#475569"/></marker>
