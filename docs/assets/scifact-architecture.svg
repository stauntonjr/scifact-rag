<text x="40" y="634" class="detail">Fast retrieval alternative: BM25 + token-window RRF · Citation identity is checked; scientific support is evaluated separately.</text>

<rect x="40" y="660" width="545" height="147" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="60" y="688" class="label" fill="#1d4ed8">RETRIEVAL EVALUATION</text>
<text x="60" y="720" class="body">SciFact relevance labels → per-query ranked results</text>
<text x="60" y="749" class="body">nDCG · recall · MRR · latency · candidate diagnostics</text>
<text x="60" y="784" class="detail">Inspected validation partition; comparative engineering evidence</text>

<rect x="615" y="660" width="545" height="147" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
<text x="635" y="688" class="label" fill="#6d28d9">GENERATION EVALUATION</text>
<text x="635" y="720" class="body">Answer + supplied evidence → automatic / human review</text>
<text x="635" y="749" class="body">Support · contradiction · qualifiers · insufficiency</text>
<text x="635" y="784" class="detail">Short-abstract results do not establish long-document quality</text>

<text x="40" y="842" class="detail">Reproducibility: frozen manifests · component revisions · artifact digests · retained failures and limitations</text>
<rect x="40" y="862" width="1120" height="48" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="60" y="891" class="detail">Outside default: NLI scores not promoted · Proposition / graph work stopped at qualification · No agent workflow</text>
